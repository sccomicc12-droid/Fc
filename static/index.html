<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고객센터 - 1단계 테스트</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <h1>고객센터 (1단계: 회원 기능 테스트)</h1>

    <section id="status" class="card"></section>

    <section class="card" id="auth-forms">
      <form id="signup-form">
        <h2>회원가입</h2>
        <input name="username" placeholder="아이디 (영문/숫자 4~20자)" required>
        <input name="nickname" placeholder="닉네임" required>
        <input name="password" type="password" placeholder="비밀번호 (8자 이상)" required>
        <button>가입하기</button>
      </form>

      <form id="login-form">
        <h2>로그인</h2>
        <input name="username" placeholder="아이디" required>
        <input name="password" type="password" placeholder="비밀번호" required>
        <button>로그인</button>
      </form>
    </section>

    <p id="message"></p>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
