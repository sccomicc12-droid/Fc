<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>MintDesk 고객센터</title>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="hero">
      <span class="badge">24시간 실시간 1:1 상담</span>
      <h1>무엇을 <span class="mint">도와드릴까요?</span></h1>
      <p>문의 유형을 선택하면 상담원과 바로 1:1 채팅으로 연결됩니다.</p>
      <div class="hero-actions" id="hero-actions">
        <a class="btn btn-mint" href="/start">상담 신청 시작하기</a>
        <a class="btn btn-outline" href="#categories">문의 유형 보기</a>
      </div>
    </section>

    <section id="categories">
      <h2 class="section-title">문의 카테고리</h2>
      <div class="category-grid" id="category-grid"></div>
    </section>

    <section>
      <h2 class="section-title">이용 방법</h2>
      <div class="steps">
        <div class="card step"><div class="step-num">STEP 01</div><h4>회원가입 · 로그인</h4><p>아이디 하나로 간단하게 가입하세요.</p></div>
        <div class="card step"><div class="step-num">STEP 02</div><h4>문의 유형 선택</h4><p>카테고리를 고르면 담당 상담원에게 연결됩니다.</p></div>
        <div class="card step"><div class="step-num">STEP 03</div><h4>실시간 1:1 채팅</h4><p>상담원과 실시간으로 대화하며 해결하세요.</p></div>
      </div>
    </section>
  </main>

  <footer class="footer">© 2026 MintDesk · 웹 개발 동아리 프로젝트 · <a class="mint" href="/form-demo">입력 폼 UI 예제</a></footer>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
