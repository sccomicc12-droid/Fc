<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>로그인 · MintDesk</title>
</head>
<body>
  <header id="site-header"></header>
  <main class="auth-wrap">
    <form class="card card-mint auth-card" id="login-form">
      <h1>로그인</h1>
      <p class="sub">다시 오신 것을 환영합니다.</p>
      <div class="field">
        <label for="username">아이디</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="form-error"></p>
      <button class="btn btn-mint btn-block">로그인</button>
      <p class="auth-switch">계정이 없으신가요? <a href="/signup">회원가입</a></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
