<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>회원가입 · MintDesk</title>
</head>
<body>
  <header id="site-header"></header>
  <main class="auth-wrap">
    <form class="card card-mint auth-card" id="signup-form">
      <h1>회원가입</h1>
      <p class="sub">가입하고 1:1 상담을 시작하세요.</p>
      <div class="field">
        <label for="username">아이디</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="off"
               pattern="[a-zA-Z0-9_]{4,20}" required>
        <span class="hint">영문, 숫자, _ 사용 4~20자</span>
      </div>
      <div class="field">
        <label for="nickname">닉네임</label>
        <input class="input" id="nickname" name="nickname" maxlength="20" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input class="input" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <span class="hint">8자 이상</span>
      </div>
      <div class="field">
        <label for="password2">비밀번호 확인</label>
        <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" required>
      </div>
      <p class="form-error" id="form-error"></p>
      <button class="btn btn-mint btn-block">가입하기</button>
      <p class="auth-switch">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
